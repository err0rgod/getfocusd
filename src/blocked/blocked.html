<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>

  <main class="wrap">
    <div class="lock-wrap" aria-hidden="true">
      <svg class="lock-glyph" viewBox="0 0 24 24" width="56" height="56" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="9" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
    </div>

    <h1 id="headline" class="headline">This site is blocked</h1>
    <p id="subline" class="subline" hidden></p>
    <p id="reason" class="reason" hidden></p>

    <section class="countdown-card" aria-label="Time remaining">
      <p class="countdown-label">Time remaining</p>
      <p id="countdown" class="countdown">--:--:--</p>
    </section>

    <blockquote id="quote" class="quote" hidden>
      <p id="quote-text" class="quote-text"></p>
      <footer id="quote-author" class="quote-author"></footer>
    </blockquote>

    <p id="attempts" class="attempts" hidden></p>

    <button id="dashboard-link" class="dashboard-link" type="button">
      Open GetFocusd dashboard
    </button>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
